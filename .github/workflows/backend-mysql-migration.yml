name: Backend MySQL migration verification

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-mysql-migration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MYSQL_MIGRATION_CI: "true"
      MYSQL_TEST_URL: jdbc:mysql://127.0.0.1:3306/leave_migration_ci
      MYSQL_TEST_USER: leave_ci
      MYSQL_TEST_PASSWORD: ci-only-test-password
      MYSQL_ROOT_PASSWORD: ci-only-root-password
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root-password
          MYSQL_DATABASE: leave_migration_ci
          MYSQL_USER: leave_ci
          MYSQL_PASSWORD: ci-only-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Set database collation
        run: >-
          mysql --host=127.0.0.1 --user=root --password="$MYSQL_ROOT_PASSWORD"
          --execute="ALTER DATABASE leave_migration_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
      - name: Verify Flyway migration on MySQL
        working-directory: backend
        run: ./mvnw --batch-mode -Dtest=MySqlMigrationTests test
