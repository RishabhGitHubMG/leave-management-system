spring.application.name=leave
server.port=${PORT:8080}

# Database must be supplied by an explicit profile/environment; never fall back to in-memory H2.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=false

# JWT (secret must be provided via JWT_SECRET, at least 32 bytes)
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=settribe-leave-management
app.jwt.expiration-ms=86400000

# Optional bootstrap admin (created on startup only when both values are set and the account does not exist)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Email (Gmail SMTP; credentials come from MAIL_USERNAME / MAIL_PASSWORD, HR recipient from HR_EMAIL)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.hr-email=${HR_EMAIL:}

# CORS
app.cors.allowed-origin=${CORS_ORIGIN:*}
