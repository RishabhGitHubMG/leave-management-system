spring.application.name=leave
server.port=${PORT:8080}

# Database (defaults to embedded H2 in MySQL compatibility mode if no external DB_URL is supplied)
spring.datasource.url=${DB_URL:jdbc:h2:mem:leave_management;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=false

# JWT (secret must be provided via JWT_SECRET, at least 32 characters)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Optional bootstrap admin (created on startup only when both values are set and the account does not exist)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Email (Gmail SMTP; credentials come from MAIL_USERNAME / MAIL_PASSWORD, HR recipient from HR_EMAIL)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.hr-email=${HR_EMAIL:}

# CORS
app.cors.allowed-origin=${CORS_ORIGIN:*}
