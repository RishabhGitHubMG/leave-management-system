spring.application.name=leave
server.port=8080

# Database (credentials come from environment variables, nothing is hardcoded)
spring.datasource.url=jdbc:mysql://localhost:3306/leave_management
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

# JPA: validate checks entities against schema.sql, it never alters tables
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# CORS (React dev server)
app.cors.allowed-origin=http://localhost:5173