spring.application.name=leave
server.port=${PORT:8080}

# Database (defaults to embedded H2 in MySQL compatibility mode if no external DB_URL is supplied)
spring.datasource.url=${DB_URL:jdbc:h2:mem:leave_management;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT (secret must be at least 32 characters)
app.jwt.secret=${JWT_SECRET:OlDOZPwQnfNJJLN8W3l6LozDv1t2i76cjCbSacgrmC0=}
app.jwt.expiration-ms=86400000

# CORS
app.cors.allowed-origin=${CORS_ORIGIN:*}
