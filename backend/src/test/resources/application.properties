spring.profiles.active=test
spring.datasource.url=jdbc:h2:mem:leave_management_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=false
server.port=${PORT:8080}
app.jwt.issuer=settribe-leave-management
app.jwt.expiration-ms=86400000
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.notifications.email-dispatch-ms=3600000
app.hr-email=${HR_EMAIL:}
app.cors.allowed-origin=${CORS_ORIGIN:*}
