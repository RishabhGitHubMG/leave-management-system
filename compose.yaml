services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DDL_AUTO: validate
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8080}:8080"
    restart: unless-stopped

  postgres-backup:
    image: postgres:15
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - while true; do sh /usr/local/bin/postgres-backup.sh || echo 'PostgreSQL backup failed; it will retry at the next interval' >&2; sleep "$${BACKUP_INTERVAL_SECONDS}"; done
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      PGUSER: ${DB_USER:?Set DB_USER in .env}
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:?Set BACKUP_RETENTION_DAYS in .env}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_VOLUME_MARKER: ${BACKUP_VOLUME_MARKER:?Set BACKUP_VOLUME_MARKER in .env}
    volumes:
      - type: bind
        source: ${BACKUP_DIR:?Set BACKUP_DIR to a directory on a separate persistent disk}
        target: /backups
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: ${BACKUP_DIR:?Set BACKUP_DIR to a directory on a separate persistent disk}/.backup-volume-marker
        target: /backups/.backup-volume-marker
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./scripts/postgres-backup.sh
        target: /usr/local/bin/postgres-backup.sh
        read_only: true
    restart: unless-stopped

volumes:
  postgres-data:
