services:
  - type: web
    name: leave-management-system-render-app
    runtime: docker
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: DB_CONNECTION_STRING
        fromDatabase:
          name: leave-management-db
          property: connectionString
      - key: DB_USER
        fromDatabase:
          name: leave-management-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: leave-management-db
          property: password
      - key: JWT_SECRET
        generateValue: true
